<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>CMA Office</title>
<style>
  body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;background:#f4f7fc;color:#14213d;font:14px/1.5 "Segoe UI",system-ui,sans-serif}
  @media (prefers-color-scheme: dark){body{background:#0f1524;color:#e6ecf8}}
  div{text-align:center;max-width:420px;padding:20px} button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
  small{opacity:.7;display:block;margin:10px 0}
</style>
</head>
<body>
<div>
  <h2>Cannot open CMA Office</h2>
  <p>Check the internet connection. If work is on, it keeps going and sends the data when the internet is back.</p>
  <small id="why"></small>
  <button onclick="window.cmaDesktop.retry()">Try again</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("why").textContent = (q.get("url") || "") + " · " + (q.get("why") || "");
</script>
</body>
</html>
