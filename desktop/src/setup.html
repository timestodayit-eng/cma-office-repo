<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>CMA Office setup</title>
<style>
  :root{--bg:#f4f7fc;--panel:#fff;--ink:#14213d;--muted:#5b6b88;--line:#dce4f2;--pri:#2563eb;--bad:#b42318}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1524;--panel:#172036;--ink:#e6ecf8;--muted:#9aa8c4;--line:#26314d;--pri:#5b8cff;--bad:#ff8a80}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:22px;margin:0} .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
  pre{white-space:pre-wrap;font:12.5px/1.55 "Segoe UI",system-ui,sans-serif;margin:0;max-height:300px;overflow:auto}
  input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px}
  button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer} button:disabled{opacity:.5}
  .muted{color:var(--muted);font-size:12.5px} .err{color:var(--bad);font-size:13px} label.row{display:flex;gap:8px;align-items:flex-start}
</style>
</head>
<body>
<main>
  <h1>CMA Office</h1>
  <div class="card">
    <b>Work Monitor: please read / দয়া করে পড়ুন</b>
    <pre id="notice"></pre>
    <label class="row"><input type="checkbox" id="ok"> <span>I have read this. / আমি পড়েছি।</span></label>
  </div>
  <div class="card">
    <b>Office app address / অফিস অ্যাপের ঠিকানা</b>
    <span class="muted">Your admin gives it to you, for example 187.1.2.3:3000</span>
    <input type="text" id="url" placeholder="187.1.2.3:3000" autocomplete="off" spellcheck="false">
    <div class="err" id="err"></div>
    <button id="go" disabled>Open CMA Office</button>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  window.setup.info().then((i) => {
    $("notice").textContent = i.notice;
    $("url").value = i.server.replace(/^https?:\/\//, "");
    if (i.consent) { $("ok").checked = true; }
    $("go").disabled = !$("ok").checked;
  });
  $("ok").addEventListener("change", () => { $("go").disabled = !$("ok").checked; });
  async function go() {
    if (!$("ok").checked) return;
    $("go").disabled = true; $("err").textContent = "Checking the address…";
    const r = await window.setup.save($("url").value);
    if (r && r.error) { $("err").textContent = r.error; $("go").disabled = false; }
  }
  $("go").addEventListener("click", go);
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
</script>
</body>
</html>
