# Use when a shared proxy (Caddy) on the VPS owns ports 80/443 and serves several sites.
# Our own caddy is turned off; the web container joins that proxy's network as "cma-office-web",
# and the proxy forwards  <domain> -> cma-office-web:3000.
#   PROXY_NETWORK=<network of the proxy>  (put it in .env; install.sh sets it to "web")
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
services:
  web:
    networks:
      default:
      proxy:
        aliases: [cma-office-web]
  caddy:
    profiles: ["disabled"]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-page-moderator-studio_default}
